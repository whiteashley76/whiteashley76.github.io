<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hello Pages</title>
  <meta name="description" content="Path verification site" />
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --accent: #38bdf8;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background:
        radial-gradient(900px 500px at 10% -10%, rgba(56,189,248,.18), transparent 55%),
        radial-gradient(700px 400px at 100% 0%, rgba(167,139,250,.12), transparent 50%),
        var(--bg);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      width: min(720px, 100%);
      background: linear-gradient(180deg, rgba(255,255,255,.04), transparent 40%), var(--card);
      border: 1px solid #334155;
      border-radius: 18px;
      padding: 36px 32px;
      box-shadow: 0 20px 50px rgba(0,0,0,.35);
    }
    h1 {
      margin: 0 0 12px;
      font-size: clamp(28px, 5vw, 40px);
      letter-spacing: .02em;
    }
    p { margin: 0; color: var(--muted); line-height: 1.7; font-size: 16px; }
    .meta {
      margin-top: 22px;
      padding-top: 16px;
      border-top: 1px solid #334155;
      font-size: 13px;
      color: #64748b;
      word-break: break-all;
    }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <main class="card">
    <h1>Hello Pages</h1>
    <p>Path verification site</p>
    <div class="meta">
      Hosted on GitHub Pages ·
      <a href="https://whiteashley76.github.io">https://whiteashley76.github.io</a>
    </div>
  </main>
</body>
</html>
